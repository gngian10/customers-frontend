<mat-sidenav-container class="app-shell">
  <mat-sidenav
    class="app-sidenav"
    [class.app-sidenav--collapsed]="collapsed() && !isMobile()"
    [mode]="sidenavMode()"
    [opened]="sidenavOpened()"
    (openedChange)="onOpenedChange($event)"
  >
    @if (!isMobile()) {
      <button
        type="button"
        class="app-sidenav__collapse-toggle"
        (click)="toggleSidenav()"
        [attr.aria-label]="collapsed() ? 'Expandir menú' : 'Colapsar menú'"
      >
        <mat-icon class="app-sidenav__collapse-toggle-icon">{{
          collapsed() ? 'chevron_right' : 'chevron_left'
        }}</mat-icon>
      </button>
    }

    <mat-nav-list class="app-nav">
      <a
        mat-list-item
        class="app-nav__item"
        routerLink="/customers"
        routerLinkActive="app-nav__item--active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: true }"
        aria-label="Clientes"
        (click)="onNavLinkClick()"
      >
        <mat-icon matListItemIcon>people</mat-icon>
        <span matListItemTitle class="app-nav__label">Clientes</span>
      </a>
      <a
        mat-list-item
        class="app-nav__item"
        routerLink="/indicadores"
        routerLinkActive="app-nav__item--active"
        ariaCurrentWhenActive="page"
        aria-label="Indicadores"
        (click)="onNavLinkClick()"
      >
        <mat-icon matListItemIcon>bar_chart</mat-icon>
        <span matListItemTitle class="app-nav__label">Indicadores</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="app-shell__content">
    @if (isMobile()) {
      <mat-toolbar class="app-toolbar">
        <button
          mat-icon-button
          type="button"
          (click)="toggleSidenav()"
          aria-label="Abrir menú de navegación"
        >
          <mat-icon>menu</mat-icon>
        </button>
        <span class="app-toolbar__brand">Gestión de clientes</span>
      </mat-toolbar>
    }

    <main class="app-content">
      <div class="app-content__inner">
        <router-outlet />
      </div>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
